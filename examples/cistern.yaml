repositories:
  local:
    type: local
    path: /var/lib/cistern/repo
  s3-main:
    type: s3
    endpoint: https://s3.ap-southeast-1.amazonaws.com
    region: ap-southeast-1
    bucket: company-backups
    prefix: cistern
    access_key_id: ${S3_ACCESS_KEY_ID}
    secret_access_key: ${S3_SECRET_ACCESS_KEY}
    part_size_mb: 16
    object_lock: { mode: COMPLIANCE, days: 7 }

encryption:
  recipients:
    - ${CISTERN_RECIPIENT}

compression:
  level: 6

metrics:
  listen: ":9464"

notify:
  webhooks:
    - url: ${SLACK_WEBHOOK_URL}
      format: slack
      on: [failure]

scheduler:
  timezone: Asia/Ho_Chi_Minh

defaults:
  repository: s3-main
  timeout: 6h
  retention: { last: 3, daily: 7, weekly: 4, monthly: 6 }
  prune_after_backup: true
  run_history_days: 400

daemon:
  api_token: ${CISTERN_DAEMON_TOKEN}
  api_listen: ":9465"

server:
  name: production
  listen: ":8443"
  public_url: https://backup.example.com
  tls: { upstream: true }
  session_key: ${CISTERN_SESSION_KEY}
  oidc:
    issuer: https://sso.example.com/realms/ops
    client_id: cistern
    client_secret: ${CISTERN_OIDC_CLIENT_SECRET}
  roles:
    - { group: backup-viewers, roles: [viewer] }
    - { group: backup-operators, roles: [operator] }
    - { group: dba, roles: [restorer] }
    - { group: dba-leads, roles: [approver] }
    - { group: platform-admins, roles: [admin] }
  daemon:
    url: http://cistern:9465
    token: ${CISTERN_DAEMON_TOKEN}
  rate_limit: { login_per_minute: 10, write_per_minute: 30, read_per_minute: 600 }
  trusted_proxies: ["10.0.0.0/8"]
  # Admins may run prune from the UI only when the daemon holds credentials that may delete.
  prune: { enabled: false }

jobs:
  - name: orders-db
    driver: postgres
    schedule: "0 2 * * *"
    verify_schedule: "@daily"
    params:
      host: ${PGHOST}
      port: ${PGPORT:-5432}
      user: backup
      password: ${PGPASSWORD}
      databases: [orders]
    restore_targets:
      - name: staging
        description: Staging PostgreSQL server
        production: false
        set:
          host: ${STAGING_PGHOST}
          password: ${STAGING_PGPASSWORD}
      - name: production
        description: The live orders database server
        production: true
    # Weekly restore drill into staging as orders_drill, checked and dropped again (docs/drills.md).
    drill:
      schedule: "0 4 * * 0"
      target: staging
      max_age_days: 14
      checks:
        - { name: orders exist, sql: "SELECT count(*) FROM orders", min: 1 }
        - { name: recent orders, sql: "SELECT count(*) FROM orders WHERE created_at > now() - interval '2 days'", min: 1 }

  - name: shop-db
    driver: mysql
    schedule: "30 2 * * *"
    params:
      host: ${MYSQL_HOST:-mysql}
      user: backup
      password: ${MYSQL_PASSWORD}
      databases: [shop]

  - name: uploads
    driver: s3
    schedule: "0 3 * * *"
    params:
      endpoint: https://s3.ap-southeast-1.amazonaws.com
      region: ap-southeast-1
      bucket: app-uploads
      prefix: uploads/
