repositories:
  local:
    type: local
    path: /var/lib/cistern/repo
  s3-main:
    type: s3
    endpoint: https://s3.ap-southeast-1.amazonaws.com
    region: ap-southeast-1
    bucket: company-backups
    prefix: cistern
    access_key_id: ${S3_ACCESS_KEY_ID}
    secret_access_key: ${S3_SECRET_ACCESS_KEY}
    part_size_mb: 16
    object_lock: { mode: COMPLIANCE, days: 7 }

encryption:
  recipients:
    - ${CISTERN_RECIPIENT}

compression:
  level: 6

metrics:
  listen: ":9464"

notify:
  webhooks:
    - url: ${SLACK_WEBHOOK_URL}
      format: slack
      on: [failure]

scheduler:
  timezone: Asia/Ho_Chi_Minh

defaults:
  repository: s3-main
  timeout: 6h
  retention: { last: 3, daily: 7, weekly: 4, monthly: 6 }
  prune_after_backup: true

jobs:
  - name: orders-db
    driver: postgres
    schedule: "0 2 * * *"
    verify_schedule: "@daily"
    params:
      host: ${PGHOST}
      port: ${PGPORT:-5432}
      user: backup
      password: ${PGPASSWORD}
      databases: [orders]

  - name: shop-db
    driver: mysql
    schedule: "30 2 * * *"
    params:
      host: ${MYSQL_HOST:-mysql}
      user: backup
      password: ${MYSQL_PASSWORD}
      databases: [shop]

  - name: uploads
    driver: s3
    schedule: "0 3 * * *"
    params:
      endpoint: https://s3.ap-southeast-1.amazonaws.com
      region: ap-southeast-1
      bucket: app-uploads
      prefix: uploads/
