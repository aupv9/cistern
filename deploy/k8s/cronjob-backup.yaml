apiVersion: batch/v1
kind: CronJob
metadata:
  name: cistern-orders-db
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
          containers:
            - name: cistern
              image: cistern:dev
              args: ["backup", "--job", "orders-db"]
              env:
                - { name: CISTERN_CONFIG, value: /etc/cistern/cistern.yaml }
                - { name: CISTERN_TMPDIR, value: /scratch }
              securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
              volumeMounts:
                - { name: config, mountPath: /etc/cistern, readOnly: true }
                - { name: scratch, mountPath: /scratch }
          volumes:
            - name: config
              configMap: { name: cistern-config }
            - name: scratch
              emptyDir: { sizeLimit: 20Gi }
