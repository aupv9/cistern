apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cistern
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cistern
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 9464
          protocol: TCP
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [cistern-server] }
      ports:
        - port: 9465
          protocol: TCP
