apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cistern-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cistern-server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8443
          protocol: TCP
