name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./cmd/cistern

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - run: go build -tags ui -o /dev/null ./cmd/cistern
        working-directory: .

  e2e:
    name: e2e (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [postgres, s3, mysql, mariadb, s3-driver, server, oidc, ui]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - uses: actions/setup-node@v7
        if: matrix.target == 'ui'
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: matrix.target == 'ui'
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: ./scripts/e2e-local.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        if: failure() && matrix.target == 'ui'
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  image:
    name: image and kubernetes
    needs: [test, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - run: docker build --build-arg VERSION="$(git describe --tags --always)" -t cistern:dev .
      - run: ./scripts/e2e-local.sh image
      - name: Install k3d
        run: |
          curl -fsSLo k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  k3d" | sha256sum -c -
          sudo install -m 0755 k3d /usr/local/bin/k3d
      - run: ./scripts/e2e-k8s.sh

  publish:
    name: publish image
    needs: [test, web, e2e, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}

  release:
    name: github release
    needs: [test, web, e2e, image, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - run: make ui
      - run: make dist VERSION="${GITHUB_REF_NAME}"
      - run: make release-notes VERSION="${GITHUB_REF_NAME}"
      - name: Check the binaries
        run: |
          tar -xzOf "dist/cistern_${GITHUB_REF_NAME}_linux_amd64.tar.gz" "cistern_${GITHUB_REF_NAME}_linux_amd64/cistern" > /tmp/cistern
          chmod +x /tmp/cistern
          /tmp/cistern version | tee /dev/stderr | grep -F "${GITHUB_REF_NAME}"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Cistern ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md dist/*.tar.gz dist/SHA256SUMS
